<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sail-CV Cameras</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 12px; }
    h1 { color: #ccc; font-family: monospace; font-size: 14px; letter-spacing: 2px; }
    .feeds { display: flex; gap: 12px; }
    .feed { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .feed span { color: #666; font-family: monospace; font-size: 11px; }
    img { display: block; max-width: 100%; border: 1px solid #333; }
  </style>
</head>
<body>
  <h1>SAIL-CV / LIVE</h1>
  <div class="feeds">
    <div class="feed">
      <img src="/stream/1" alt="Camera 1">
      <span>CAM 1 — 192.168.1.214</span>
    </div>
    <div class="feed">
      <img src="/stream/2" alt="Camera 2">
      <span>CAM 2 — 192.168.1.34</span>
    </div>
  </div>
</body>
</html>
