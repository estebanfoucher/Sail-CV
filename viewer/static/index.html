<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Point Cloud Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #eee; font-family: monospace; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui {
      position: absolute; top: 16px; left: 16px;
      display: flex; gap: 8px; align-items: center;
    }
    select, button {
      background: #1a1a1a; color: #eee; border: 1px solid #333;
      padding: 6px 12px; border-radius: 4px; font-family: monospace; font-size: 13px;
      cursor: pointer;
    }
    select:hover, button:hover { border-color: #666; }
    #info {
      position: absolute; bottom: 16px; left: 16px;
      font-size: 12px; color: #555;
    }
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 14px; color: #555; display: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui">
    <select id="scene-select"><option value="">— select scene —</option></select>
    <button id="load-btn">Load</button>
  </div>
  <div id="loading">Loading...</div>
  <div id="info">Drag to rotate · Scroll to zoom · Right-drag to pan</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

    // Scene setup
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
    camera.position.set(0, 0, 5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Axes helper (subtle)
    scene.add(new THREE.AxesHelper(1));

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Animate
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });

    // Load scenes list
    const sceneSelect = document.getElementById('scene-select');
    const loadBtn = document.getElementById('load-btn');
    const loading = document.getElementById('loading');

    fetch('/scenes').then(r => r.json()).then(({ scenes }) => {
      scenes.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sceneSelect.appendChild(opt);
      });
      if (scenes.length === 1) {
        sceneSelect.value = scenes[0];
        loadScene(scenes[0]);
      }
    });

    let currentMesh = null;

    function loadScene(name) {
      if (!name) return;
      loading.style.display = 'block';
      const loader = new PLYLoader();
      loader.load(`/ply/${name}`, (geometry) => {
        if (currentMesh) scene.remove(currentMesh);

        geometry.computeVertexNormals();

        // Color by height (Y axis) if no vertex colors
        if (!geometry.attributes.color) {
          const positions = geometry.attributes.position;
          const colors = new Float32Array(positions.count * 3);
          let minY = Infinity, maxY = -Infinity;
          for (let i = 0; i < positions.count; i++) {
            const y = positions.getY(i);
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
          const color = new THREE.Color();
          for (let i = 0; i < positions.count; i++) {
            const t = (positions.getY(i) - minY) / (maxY - minY);
            color.setHSL(0.6 - t * 0.4, 1.0, 0.5);
            colors[i * 3] = color.r;
            colors[i * 3 + 1] = color.g;
            colors[i * 3 + 2] = color.b;
          }
          geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        }

        const material = new THREE.PointsMaterial({
          size: 0.05,
          vertexColors: true,
          sizeAttenuation: true,
        });
        currentMesh = new THREE.Points(geometry, material);
        scene.add(currentMesh);

        // Center camera on point cloud
        geometry.computeBoundingBox();
        const box = geometry.boundingBox;
        const center = new THREE.Vector3();
        box.getCenter(center);
        const size = new THREE.Vector3();
        box.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        controls.target.copy(center);
        camera.position.copy(center).add(new THREE.Vector3(0, 0, maxDim * 2));
        controls.update();

        loading.style.display = 'none';
      }, undefined, (err) => {
        loading.style.display = 'none';
        console.error(err);
      });
    }

    loadBtn.addEventListener('click', () => loadScene(sceneSelect.value));
  </script>
</body>
</html>
