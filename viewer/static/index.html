<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Point Cloud Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #eee; font-family: monospace; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; }

    #ui {
      position: absolute; top: 16px; left: 16px;
      display: flex; gap: 8px; align-items: center;
    }
    select {
      background: #1a1a1a; color: #eee; border: 1px solid #333;
      padding: 6px 12px; border-radius: 4px; font-family: monospace; font-size: 13px;
    }
    #toggle-btn {
      padding: 6px 18px; border-radius: 4px; font-family: monospace; font-size: 13px;
      border: 1px solid #444; cursor: pointer; transition: background 0.15s, border-color 0.15s;
      background: #1a1a1a; color: #eee;
    }
    #toggle-btn.running {
      background: #3a1a1a; border-color: #c0392b; color: #e74c3c;
    }
    #toggle-btn.loading {
      opacity: 0.5; cursor: default;
    }

    #stats {
      position: absolute; top: 16px; right: 16px;
      text-align: right; font-size: 12px; line-height: 1.8;
      color: #555;
    }
    #stats span { color: #aaa; }

    #info {
      position: absolute; bottom: 16px; left: 16px;
      font-size: 11px; color: #333;
    }
    #status-msg {
      position: absolute; bottom: 16px; right: 16px;
      font-size: 11px; color: #555;
    }
    #log-panel {
      position: absolute; bottom: 40px; left: 16px;
      width: 600px; max-height: 180px;
      background: rgba(0,0,0,0.75);
      border: 1px solid #222;
      border-radius: 4px;
      overflow-y: auto;
      font-size: 11px; line-height: 1.6;
      padding: 8px;
      display: none;
    }
    #log-panel .line { color: #666; white-space: pre-wrap; word-break: break-all; }
    #log-panel .line.error { color: #e74c3c; }
    #log-panel .line.info { color: #aaa; }
    #log-toggle {
      position: absolute; bottom: 16px; left: 16px;
      background: none; border: none; color: #333; font-family: monospace;
      font-size: 11px; cursor: pointer; padding: 0;
    }
    #log-toggle:hover { color: #666; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui">
    <select id="scene-select"><option value="">— select scene —</option></select>
    <button id="toggle-btn">Start</button>
  </div>

  <div id="stats">
    <div>reconstruction &nbsp;<span id="stat-recon">—</span></div>
    <div>recon fps &nbsp;<span id="stat-fps">—</span></div>
    <div>frames &nbsp;<span id="stat-frames">—</span></div>
    <div>render fps &nbsp;<span id="stat-render">—</span></div>
    <div>points &nbsp;<span id="stat-points">—</span></div>
  </div>

  <div id="log-panel"></div>
  <button id="log-toggle">logs ▲</button>
  <div id="info" style="left:60px">Drag · Scroll · Right-drag to pan</div>
  <div id="status-msg"></div>

  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

    // --- Three.js setup ---
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);
    scene.add(new THREE.AxesHelper(1));

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.001, 1000);
    camera.position.set(0, 0, 5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Render FPS tracking
    let lastRenderTime = performance.now();
    let renderFps = 0;
    renderer.setAnimationLoop(() => {
      const now = performance.now();
      renderFps = 1000 / (now - lastRenderTime);
      lastRenderTime = now;
      controls.update();
      renderer.render(scene, camera);
      document.getElementById('stat-render').textContent = renderFps.toFixed(1) + ' fps';
    });

    // --- PLY loading ---
    const loader = new PLYLoader();
    let currentMesh = null;
    let loadVersion = 0;

    function loadPly(sceneName, version) {
      const myVersion = ++loadVersion;
      loader.load(
        `/ply/${sceneName}?v=${version}`,
        (geometry) => {
          if (myVersion !== loadVersion) return; // superseded

          if (currentMesh) { scene.remove(currentMesh); currentMesh.geometry.dispose(); }

          geometry.computeVertexNormals();

          // Color by height if no vertex colors
          if (!geometry.attributes.color) {
            const pos = geometry.attributes.position;
            const colors = new Float32Array(pos.count * 3);
            let minY = Infinity, maxY = -Infinity;
            for (let i = 0; i < pos.count; i++) {
              const y = pos.getY(i);
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
            const c = new THREE.Color();
            for (let i = 0; i < pos.count; i++) {
              const t = (pos.getY(i) - minY) / (maxY - minY || 1);
              c.setHSL(0.6 - t * 0.4, 1.0, 0.5);
              colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
            }
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
          }

          currentMesh = new THREE.Points(geometry, new THREE.PointsMaterial({
            size: 0.05, vertexColors: true, sizeAttenuation: true,
          }));
          scene.add(currentMesh);

          // Center camera on first load
          if (version === 1) {
            geometry.computeBoundingBox();
            const box = geometry.boundingBox;
            const center = new THREE.Vector3(); box.getCenter(center);
            const size = new THREE.Vector3(); box.getSize(size);
            controls.target.copy(center);
            camera.position.copy(center).add(new THREE.Vector3(0, 0, Math.max(size.x, size.y, size.z) * 2));
            controls.update();
          }

          document.getElementById('stat-points').textContent = geometry.attributes.position.count.toLocaleString();
          setStatus('');
        },
        undefined,
        (err) => { setStatus('PLY load error'); console.error(err); }
      );
    }

    // --- UI ---
    const sceneSelect = document.getElementById('scene-select');
    const toggleBtn = document.getElementById('toggle-btn');

    fetch('/scenes').then(r => r.json()).then(({ scenes }) => {
      scenes.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sceneSelect.appendChild(opt);
      });
      if (scenes.length === 1) sceneSelect.value = scenes[0];
    });

    // Load initial PLY for selected scene on scene change
    sceneSelect.addEventListener('change', () => {
      const s = sceneSelect.value;
      if (s) loadPly(s, Date.now());
    });

    let running = false;
    let eventSource = null;
    let reconTimes = [];

    toggleBtn.addEventListener('click', async () => {
      if (toggleBtn.classList.contains('loading')) return;
      const scene = sceneSelect.value;
      if (!scene) { setStatus('Select a scene first'); return; }

      if (!running) {
        toggleBtn.classList.add('loading');
        const res = await fetch(`/start/${scene}`, { method: 'POST' });
        toggleBtn.classList.remove('loading');
        if (!res.ok) { setStatus((await res.json()).error); return; }
        running = true;
        toggleBtn.textContent = 'Stop';
        toggleBtn.classList.add('running');
        startSSE(scene);
      } else {
        await fetch('/stop', { method: 'POST' });
        running = false;
        toggleBtn.textContent = 'Start';
        toggleBtn.classList.remove('running');
        stopSSE();
        resetStats();
      }
    });

    function startSSE(sceneName) {
      eventSource = new EventSource('/events');
      eventSource.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.error) { setStatus('Error: ' + data.error); return; }

        const { frame, recon_ms } = data;
        reconTimes.push(recon_ms);
        if (reconTimes.length > 10) reconTimes.shift();
        const avgMs = reconTimes.reduce((a, b) => a + b, 0) / reconTimes.length;
        const fps = 1000 / avgMs;

        document.getElementById('stat-recon').textContent = recon_ms.toFixed(0) + ' ms';
        document.getElementById('stat-fps').textContent = fps.toFixed(3) + ' fps';
        document.getElementById('stat-frames').textContent = frame;

        setStatus(`Rendering frame ${frame}...`);
        loadPly(sceneName, frame);
      };
      eventSource.onerror = () => setStatus('SSE connection lost');
    }

    function stopSSE() {
      if (eventSource) { eventSource.close(); eventSource = null; }
    }

    function resetStats() {
      reconTimes = [];
      ['stat-recon', 'stat-fps', 'stat-frames'].forEach(id => {
        document.getElementById(id).textContent = '—';
      });
    }

    function setStatus(msg) {
      document.getElementById('status-msg').textContent = msg;
    }

    // --- Log panel ---
    const logPanel = document.getElementById('log-panel');
    const logToggle = document.getElementById('log-toggle');
    let logVisible = false;

    logToggle.addEventListener('click', () => {
      logVisible = !logVisible;
      logPanel.style.display = logVisible ? 'block' : 'none';
      logToggle.textContent = logVisible ? 'logs ▼' : 'logs ▲';
    });

    function appendLog(line) {
      const div = document.createElement('div');
      div.className = 'line' + (line.includes('ERROR') || line.includes('error') ? ' error' : line.includes('INFO') ? ' info' : '');
      div.textContent = line;
      logPanel.appendChild(div);
      // Keep last 200 lines
      while (logPanel.children.length > 200) logPanel.removeChild(logPanel.firstChild);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    // Always-on log SSE stream
    const logSource = new EventSource('/logs');
    logSource.onmessage = (e) => {
      const { line } = JSON.parse(e.data);
      appendLog(line);
    };

    // Load initial scene if available
    fetch('/status').then(r => r.json()).then(s => {
      if (s.scene) {
        sceneSelect.value = s.scene;
        loadPly(s.scene, Date.now());
      }
    });
  </script>
</body>
</html>
