<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Point Cloud Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #eee; font-family: monospace; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; }

    #ui {
      position: absolute; top: 16px; left: 16px;
      display: flex; gap: 8px; align-items: center;
    }
    select, button {
      background: #1a1a1a; color: #eee; border: 1px solid #444;
      padding: 6px 14px; border-radius: 4px; font-family: monospace; font-size: 13px;
      cursor: pointer;
    }
    select:hover, button:hover { border-color: #666; }
    #start-btn { border-color: #27ae60; color: #2ecc71; }
    #start-btn:disabled { opacity: 0.4; cursor: default; }
    #stop-btn  { border-color: #c0392b; color: #e74c3c; display: none; }
    #stop-btn:disabled { opacity: 0.4; cursor: default; }

    #stats {
      position: absolute; top: 16px; right: 16px;
      text-align: right; font-size: 12px; line-height: 2;
      color: #444;
    }
    #stats .label { color: #444; }
    #stats .value { color: #aaa; min-width: 80px; display: inline-block; text-align: right; }

    /* Log panel — always visible at bottom */
    #log-panel {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 160px;
      background: rgba(0,0,0,0.82);
      border-top: 1px solid #1e1e1e;
      overflow-y: auto;
      font-size: 11px; line-height: 1.6;
      padding: 6px 12px;
    }
    #log-panel .line { color: #555; white-space: pre-wrap; word-break: break-all; }
    #log-panel .line.error { color: #e74c3c; }
    #log-panel .line.warn  { color: #f39c12; }
    #log-panel .line.info  { color: #888; }
    #log-panel .line.done  { color: #2ecc71; }

    #info {
      position: absolute; bottom: 168px; left: 16px;
      font-size: 11px; color: #2a2a2a;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui">
    <select id="scene-select"><option value="">— select scene —</option></select>
    <button id="start-btn">Start</button>
    <button id="stop-btn">Stop</button>
  </div>

  <div id="stats">
    <div><span class="label">reconstruction </span><span class="value" id="stat-recon">—</span></div>
    <div><span class="label">recon fps </span><span class="value" id="stat-fps">—</span></div>
    <div><span class="label">frames </span><span class="value" id="stat-frames">—</span></div>
    <div><span class="label">render fps </span><span class="value" id="stat-render">—</span></div>
    <div><span class="label">points </span><span class="value" id="stat-points">—</span></div>
  </div>

  <div id="log-panel"></div>
  <div id="info">Drag · Scroll · Right-drag to pan</div>

  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

    // --- Three.js ---
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight - 160);
    container.appendChild(renderer.domElement);

    const threeScene = new THREE.Scene();
    threeScene.background = new THREE.Color(0x0a0a0a);
    threeScene.add(new THREE.AxesHelper(1));

    const camera = new THREE.PerspectiveCamera(60, innerWidth / (innerHeight - 160), 0.001, 1000);
    camera.position.set(0, 0, 5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / (innerHeight - 160);
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight - 160);
    });

    let lastRenderTime = performance.now();
    renderer.setAnimationLoop(() => {
      const now = performance.now();
      document.getElementById('stat-render').textContent = (1000 / (now - lastRenderTime)).toFixed(1) + ' fps';
      lastRenderTime = now;
      controls.update();
      renderer.render(threeScene, camera);
    });

    // --- PLY loader ---
    const loader = new PLYLoader();
    let currentMesh = null;
    let loadVersion = 0;
    let firstLoad = true;

    function loadPly(sceneName, version) {
      const myVersion = ++loadVersion;
      loader.load(
        `/ply/${sceneName}?v=${version}`,
        (geometry) => {
          if (myVersion !== loadVersion) return;
          if (currentMesh) { threeScene.remove(currentMesh); currentMesh.geometry.dispose(); }

          if (!geometry.attributes.color) {
            const pos = geometry.attributes.position;
            const colors = new Float32Array(pos.count * 3);
            let minY = Infinity, maxY = -Infinity;
            for (let i = 0; i < pos.count; i++) { const y = pos.getY(i); if (y < minY) minY = y; if (y > maxY) maxY = y; }
            const c = new THREE.Color();
            for (let i = 0; i < pos.count; i++) {
              const t = (pos.getY(i) - minY) / (maxY - minY || 1);
              c.setHSL(0.6 - t * 0.4, 1.0, 0.5);
              colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
            }
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
          }

          currentMesh = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.05, vertexColors: true, sizeAttenuation: true }));
          threeScene.add(currentMesh);

          if (firstLoad) {
            firstLoad = false;
            geometry.computeBoundingBox();
            const box = geometry.boundingBox;
            const center = new THREE.Vector3(); box.getCenter(center);
            const size = new THREE.Vector3(); box.getSize(size);
            controls.target.copy(center);
            camera.position.copy(center).add(new THREE.Vector3(0, 0, Math.max(size.x, size.y, size.z) * 2));
            controls.update();
          }

          document.getElementById('stat-points').textContent = geometry.attributes.position.count.toLocaleString();
        },
        undefined,
        (err) => { appendLog('PLY load error: ' + err, 'error'); }
      );
    }

    // --- Log panel ---
    const logPanel = document.getElementById('log-panel');

    function appendLog(line, cls = '') {
      if (!cls) {
        if (/error|Error|ERROR/.test(line)) cls = 'error';
        else if (/warn|WARN|WARNING/.test(line)) cls = 'warn';
        else if (/INFO|done|complete|success/i.test(line)) cls = 'info';
        else if (/\[loop\] Frame \d+ done/.test(line)) cls = 'done';
      }
      const div = document.createElement('div');
      div.className = 'line ' + cls;
      div.textContent = line;
      logPanel.appendChild(div);
      while (logPanel.children.length > 300) logPanel.removeChild(logPanel.firstChild);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    const logSource = new EventSource('/logs');
    logSource.onmessage = (e) => { appendLog(JSON.parse(e.data).line); };
    logSource.onerror = () => appendLog('[logs SSE disconnected]', 'warn');

    // --- Scenes ---
    const sceneSelect = document.getElementById('scene-select');
    fetch('/scenes').then(r => r.json()).then(({ scenes }) => {
      scenes.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sceneSelect.appendChild(opt);
      });
      if (scenes.length >= 1) {
        sceneSelect.value = scenes[0];
        loadPly(scenes[0], Date.now());
      }
    });

    // --- Start / Stop ---
    const startBtn = document.getElementById('start-btn');
    const stopBtn  = document.getElementById('stop-btn');
    let eventSource = null;
    let reconTimes = [];
    let frameCount = 0;

    startBtn.addEventListener('click', async () => {
      const sceneName = sceneSelect.value;
      if (!sceneName) { appendLog('Select a scene first', 'warn'); return; }
      startBtn.disabled = true;
      const res = await fetch(`/start/${sceneName}`, { method: 'POST' });
      const body = await res.json();
      if (!res.ok) { appendLog('Start failed: ' + body.error, 'error'); startBtn.disabled = false; return; }
      startBtn.style.display = 'none';
      stopBtn.style.display = '';
      stopBtn.disabled = false;
      frameCount = 0;
      reconTimes = [];
      openEventStream(sceneName);
    });

    stopBtn.addEventListener('click', async () => {
      stopBtn.disabled = true;
      await fetch('/stop', { method: 'POST' });
      closeEventStream();
      stopBtn.style.display = 'none';
      startBtn.style.display = '';
      startBtn.disabled = false;
    });

    function openEventStream(sceneName) {
      eventSource = new EventSource('/events');
      eventSource.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.error) { appendLog('Reconstruction error: ' + data.error, 'error'); return; }
        const { frame, recon_ms } = data;
        frameCount = frame;
        reconTimes.push(recon_ms);
        if (reconTimes.length > 10) reconTimes.shift();
        const avgMs = reconTimes.reduce((a, b) => a + b, 0) / reconTimes.length;
        document.getElementById('stat-recon').textContent   = recon_ms.toFixed(0) + ' ms';
        document.getElementById('stat-fps').textContent     = (1000 / avgMs).toFixed(3) + ' fps';
        document.getElementById('stat-frames').textContent  = frame;
        loadPly(sceneName, frame);
      };
      eventSource.onerror = () => appendLog('[events SSE disconnected]', 'warn');
    }

    function closeEventStream() {
      if (eventSource) { eventSource.close(); eventSource = null; }
    }

    // Sync button state with server on load
    fetch('/status').then(r => r.json()).then(s => {
      if (s.running && s.scene) {
        sceneSelect.value = s.scene;
        startBtn.style.display = 'none';
        stopBtn.style.display = '';
        openEventStream(s.scene);
      }
    });
  </script>
</body>
</html>
