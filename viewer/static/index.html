<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MASt3R Match Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #eee; font-family: monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    #header {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 10px 16px; border-bottom: 1px solid #1a1a1a; flex-shrink: 0;
    }
    #header h1 { font-size: 13px; color: #555; font-weight: normal; margin-right: 8px; }
    button {
      background: #1a1a1a; color: #eee; border: 1px solid #444;
      padding: 5px 14px; border-radius: 4px; font-family: monospace; font-size: 12px; cursor: pointer;
    }
    #start-btn { border-color: #27ae60; color: #2ecc71; }
    #start-btn:disabled { opacity: 0.4; cursor: default; }
    #stop-btn  { border-color: #c0392b; color: #e74c3c; }
    #stop-btn:disabled { opacity: 0.4; cursor: default; }

    .sep { width: 1px; height: 20px; background: #222; flex-shrink: 0; }
    #calib-capture-btn { border-color: #2980b9; color: #3498db; }
    #calib-capture-btn:disabled { opacity: 0.4; cursor: default; }
    #calib-run-btn  { border-color: #8e44ad; color: #9b59b6; }
    #calib-run-btn:disabled  { opacity: 0.4; cursor: default; }
    #calib-stop-btn  { border-color: #c0392b; color: #e74c3c; }
    #calib-stop-btn:disabled  { opacity: 0.4; cursor: default; }
    #calib-status { font-size: 11px; color: #555; }
    #calib-status.ok  { color: #2ecc71; }
    #calib-status.err { color: #e74c3c; }

    #stats {
      display: flex; gap: 24px; margin-left: auto;
      font-size: 11px; color: #444;
    }
    #stats span { color: #888; }

    #main {
      flex: 1; display: flex; overflow: hidden; background: #050505;
    }
    #composite-pane {
      flex: 1; display: flex; align-items: center; justify-content: center;
      border-right: 1px solid #1a1a1a; overflow: hidden;
    }
    #composite {
      max-width: 100%; max-height: 100%; object-fit: contain; display: block;
    }
    #pc-pane {
      flex: 1; position: relative; overflow: hidden;
    }
    #pc-canvas {
      width: 100%; height: 100%; display: block;
    }
    #pc-hint {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      font-size: 10px; color: #333; pointer-events: none;
    }
    #pc-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-size: 11px; color: #333; pointer-events: none;
    }

    #profile-bar {
      flex-shrink: 0; padding: 4px 12px; background: #0a0a0a; border-top: 1px solid #1a1a1a;
      font-size: 10px; color: #777; display: flex; align-items: center; gap: 10px;
    }
    #profile-track {
      flex: 1; height: 10px; background: #181818; border-radius: 2px; overflow: hidden;
      display: flex;
    }
    #profile-track > div { height: 100%; }
    #profile-legend { display: flex; gap: 10px; flex-wrap: wrap; }
    #profile-legend span { display: inline-flex; align-items: center; gap: 4px; }
    #profile-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 1px; }

    #log-panel {
      height: 130px; flex-shrink: 0;
      background: rgba(0,0,0,0.9); border-top: 1px solid #1a1a1a;
      overflow-y: auto; font-size: 11px; line-height: 1.6; padding: 6px 12px;
    }
    #log-panel .line     { color: #444; white-space: pre-wrap; word-break: break-all; }
    #log-panel .line.err { color: #e74c3c; }
    #log-panel .line.ok  { color: #2ecc71; }
    #log-panel .line.inf { color: #777; }
  </style>
</head>
<body>

  <div id="header">
    <h1>MASt3R · Match Viewer</h1>
    <a href="/screenshots.html" style="font-size:11px;color:#3498db;text-decoration:none;border:1px solid #2980b9;padding:4px 10px;border-radius:4px">Screenshots →</a>
    <button id="start-btn">Start</button>
    <button id="stop-btn" style="display:none">Stop</button>

    <div class="sep"></div>

    <button id="calib-capture-btn">Capture Pair</button>
    <span id="calib-pair-count" style="font-size:11px;color:#555">0 pairs</span>
    <button id="calib-run-btn">Run Calibration</button>
    <button id="calib-reset-btn" style="color:#888;border-color:#333">Reset</button>
    <button id="calib-stop-btn" style="display:none">Stop Calib</button>
    <span id="calib-status"></span>

    <div class="sep"></div>
    <label class="cam-toggle" style="color:#ff4040">
      <input type="checkbox" id="cam1-img-toggle" checked /> cam1 image
    </label>
    <label class="cam-toggle" style="color:#40a0ff">
      <input type="checkbox" id="cam2-img-toggle" checked /> cam2 image
    </label>

    <div class="sep"></div>
    <label style="font-size:11px;color:#888">
      max dist (m)
      <input type="number" id="dist-threshold" value="1" min="0" step="0.1"
             style="width:60px;margin-left:4px;background:#1a1a1a;color:#eee;border:1px solid #444;padding:2px 4px;font-family:monospace;font-size:11px" />
    </label>
    <label style="font-size:11px;color:#888">
      subsample
      <input type="number" id="subsample-input" value="16" min="1" max="16" step="1"
             style="width:50px;margin-left:4px;background:#1a1a1a;color:#eee;border:1px solid #444;padding:2px 4px;font-family:monospace;font-size:11px" />
    </label>

    <div id="stats">
      <div>recon <span id="s-recon">—</span></div>
      <div>fps <span id="s-fps">—</span></div>
      <div>frames <span id="s-frames">—</span></div>
      <div>matches <span id="s-matches">—</span></div>
      <div>pts <span id="s-pts">—</span></div>
    </div>
  </div>

  <div id="main">
    <div id="composite-pane">
      <img id="composite" src="" alt="Waiting for first frame…" />
    </div>
    <div id="pc-pane">
      <canvas id="pc-canvas"></canvas>
      <div id="pc-overlay">Waiting for point cloud…</div>
      <div id="pc-hint">drag · scroll · right-drag</div>
    </div>
  </div>

  <div id="profile-bar">
    <span style="color:#555">profile</span>
    <div id="profile-track"></div>
    <div id="profile-legend"></div>
    <span id="profile-total" style="color:#aaa">—</span>
  </div>

  <div id="log-panel"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── Three.js setup ────────────────────────────────────────────────
    const pcPane   = document.getElementById('pc-pane');
    const pcCanvas = document.getElementById('pc-canvas');
    const pcOverlay = document.getElementById('pc-overlay');

    const renderer = new THREE.WebGLRenderer({ canvas: pcCanvas, antialias: false });
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene  = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);

    const camera = new THREE.PerspectiveCamera(60, 1, 0.001, 100);
    camera.position.set(0, 0, 2);

    const controls = new OrbitControls(camera, pcCanvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;

    // Axes helper
    scene.add(new THREE.AxesHelper(0.2));

    // Point cloud object (replaced each frame)
    let pointsMesh = null;
    let lastPointCloudData = null;
    let cameraMidpoint = null;  // [x,y,z] midpoint between the two camera apexes

    // Camera frusta + base point clouds (per-camera Points stored for toggling)
    let cameraObjs = [];          // wireframe LineSegments
    let cameraBases = [null, null];  // base Points per camera index
    const CAM_COLORS = [0xff4040, 0x40a0ff];

    function clearCameras() {
      for (const m of cameraObjs) {
        scene.remove(m);
        m.geometry.dispose();
        m.material.dispose();
      }
      cameraObjs = [];
      for (let i = 0; i < cameraBases.length; i++) {
        const b = cameraBases[i];
        if (b) { scene.remove(b); b.geometry.dispose(); b.material.dispose(); }
        cameraBases[i] = null;
      }
    }

    function applyBaseVisibility() {
      const flags = [
        document.getElementById('cam1-img-toggle')?.checked ?? true,
        document.getElementById('cam2-img-toggle')?.checked ?? true,
      ];
      cameraBases.forEach((b, i) => { if (b) b.visible = flags[i]; });
    }

    function drawCameraFrusta(payload) {
      clearCameras();
      const cams = payload.cameras || [];
      // Midpoint between the two camera apexes (vertex 0 of each frustum)
      if (cams.length >= 2) {
        const a = cams[0].vertices[0], b = cams[1].vertices[0];
        cameraMidpoint = [(a[0]+b[0])/2, (a[1]+b[1])/2, (a[2]+b[2])/2];
      }
      cams.forEach((cam, i) => {
        // Wireframe
        const verts = cam.vertices;
        const edges = cam.edges;
        const wp = new Float32Array(edges.length * 6);
        for (let e = 0; e < edges.length; e++) {
          const [a, b] = edges[e];
          wp[e*6+0] = verts[a][0]; wp[e*6+1] = verts[a][1]; wp[e*6+2] = verts[a][2];
          wp[e*6+3] = verts[b][0]; wp[e*6+4] = verts[b][1]; wp[e*6+5] = verts[b][2];
        }
        const wgeo = new THREE.BufferGeometry();
        wgeo.setAttribute('position', new THREE.BufferAttribute(wp, 3));
        const wmat = new THREE.LineBasicMaterial({ color: CAM_COLORS[i % CAM_COLORS.length] });
        const seg = new THREE.LineSegments(wgeo, wmat);
        scene.add(seg);
        cameraObjs.push(seg);

        // Base point cloud (frame projected onto image plane)
        const bp = cam.base_points || [];
        const bc = cam.base_colors || [];
        if (bp.length > 0) {
          const pos = new Float32Array(bp.length * 3);
          const col = new Float32Array(bp.length * 3);
          for (let k = 0; k < bp.length; k++) {
            pos[k*3]   = bp[k][0]; pos[k*3+1] = bp[k][1]; pos[k*3+2] = bp[k][2];
            col[k*3]   = bc[k][0] / 255;
            col[k*3+1] = bc[k][1] / 255;
            col[k*3+2] = bc[k][2] / 255;
          }
          const bgeo = new THREE.BufferGeometry();
          bgeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
          bgeo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
          const bmat = new THREE.PointsMaterial({ size: 0.008, vertexColors: true, sizeAttenuation: true });
          const pts = new THREE.Points(bgeo, bmat);
          scene.add(pts);
          cameraBases[i] = pts;
        }
      });
      applyBaseVisibility();
    }

    document.getElementById('cam1-img-toggle').addEventListener('change', applyBaseVisibility);
    document.getElementById('cam2-img-toggle').addEventListener('change', applyBaseVisibility);
    document.getElementById('dist-threshold').addEventListener('input', () => {
      if (lastPointCloudData) updatePointCloud(lastPointCloudData);
    });

    // Subsample (server-side, applies on next reconstructed frame)
    const subsampleInput = document.getElementById('subsample-input');
    fetch('/params').then(r => r.json()).then(p => {
      if (p && p.subsample) subsampleInput.value = p.subsample;
    }).catch(() => {});
    subsampleInput.addEventListener('change', () => {
      const v = parseInt(subsampleInput.value, 10);
      if (!Number.isFinite(v) || v < 1 || v > 16) return;
      fetch('/params', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subsample: v }),
      });
    });

    function fetchAndDrawCameras() {
      fetch('/cameras')
        .then(r => r.ok ? r.json() : null)
        .then(d => { if (d) drawCameraFrusta(d); })
        .catch(() => {});
    }

    function resizeRenderer() {
      const w = pcPane.clientWidth, h = pcPane.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    resizeRenderer();
    new ResizeObserver(resizeRenderer).observe(pcPane);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // ── Profiling bar (per-frame step breakdown) ──────────────────────
    const PROFILE_STEPS = [
      { key: 'grab',       label: 'grab',     color: '#e67e22' },
      { key: 'preproc',    label: 'preproc',  color: '#f1c40f' },
      { key: 'infer',      label: 'infer',    color: '#9b59b6' },
      { key: 'match',      label: 'match',    color: '#3498db' },
      { key: 'io',         label: 'io',       color: '#16a085' },
      { key: 'pointcloud', label: 'pc',       color: '#e74c3c' },
    ];
    function renderProfile(timings, totalMs) {
      const track  = document.getElementById('profile-track');
      const legend = document.getElementById('profile-legend');
      const totalEl = document.getElementById('profile-total');
      track.innerHTML = '';
      legend.innerHTML = '';
      const sumKnown = PROFILE_STEPS.reduce((a, s) => a + (timings[s.key] || 0), 0);
      const denom = Math.max(totalMs, sumKnown, 1);
      for (const s of PROFILE_STEPS) {
        const ms = timings[s.key] || 0;
        if (ms <= 0) continue;
        const seg = document.createElement('div');
        seg.style.background = s.color;
        seg.style.width = `${(ms / denom) * 100}%`;
        seg.title = `${s.label}: ${ms} ms`;
        track.appendChild(seg);
        const item = document.createElement('span');
        item.innerHTML = `<i style="background:${s.color}"></i>${s.label} ${ms}ms`;
        legend.appendChild(item);
      }
      const other = Math.max(0, totalMs - sumKnown);
      if (other > 5) {
        const seg = document.createElement('div');
        seg.style.background = '#444';
        seg.style.width = `${(other / denom) * 100}%`;
        seg.title = `other: ${other} ms`;
        track.appendChild(seg);
        const item = document.createElement('span');
        item.innerHTML = `<i style="background:#444"></i>other ${other}ms`;
        legend.appendChild(item);
      }
      totalEl.textContent = `total ${totalMs}ms`;
    }

    function getDistanceThreshold() {
      const v = parseFloat(document.getElementById('dist-threshold')?.value);
      return (isFinite(v) && v > 0) ? v : Infinity;
    }

    function updatePointCloud(data) {
      lastPointCloudData = data;
      if (pointsMesh) { scene.remove(pointsMesh); pointsMesh.geometry.dispose(); pointsMesh.material.dispose(); }

      const pts    = data.pts;
      const colors = data.colors;
      const n      = pts.length;

      const cx = cameraMidpoint ? cameraMidpoint[0] : 0;
      const cy = cameraMidpoint ? cameraMidpoint[1] : 0;
      const cz = cameraMidpoint ? cameraMidpoint[2] : 0;
      const maxDist = getDistanceThreshold();
      const maxDist2 = maxDist === Infinity ? Infinity : maxDist * maxDist;

      // First pass: count kept points
      let kept = 0;
      const keepMask = new Uint8Array(n);
      for (let i = 0; i < n; i++) {
        const dx = pts[i][0] - cx, dy = pts[i][1] - cy, dz = pts[i][2] - cz;
        if (dx*dx + dy*dy + dz*dz <= maxDist2) { keepMask[i] = 1; kept++; }
      }

      const positions = new Float32Array(kept * 3);
      const colArr    = new Float32Array(kept * 3);
      let j = 0;
      for (let i = 0; i < n; i++) {
        if (!keepMask[i]) continue;
        positions[j*3]   = pts[i][0];
        positions[j*3+1] = pts[i][1];
        positions[j*3+2] = pts[i][2];
        colArr[j*3]   = colors[i][0] / 255;
        colArr[j*3+1] = colors[i][1] / 255;
        colArr[j*3+2] = colors[i][2] / 255;
        j++;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color',    new THREE.BufferAttribute(colArr, 3));

      const mat = new THREE.PointsMaterial({ size: 0.005, vertexColors: true, sizeAttenuation: true });
      pointsMesh = new THREE.Points(geo, mat);
      scene.add(pointsMesh);

      pcOverlay.style.display = 'none';
      document.getElementById('s-pts').textContent = `${kept}/${n}`;
    }

    // ── UI helpers ────────────────────────────────────────────────────
    const startBtn  = document.getElementById('start-btn');
    const stopBtn   = document.getElementById('stop-btn');
    const logPanel  = document.getElementById('log-panel');
    const composite = document.getElementById('composite');
    const calibCaptureBtn  = document.getElementById('calib-capture-btn');
    const calibRunBtn      = document.getElementById('calib-run-btn');
    const calibResetBtn    = document.getElementById('calib-reset-btn');
    const calibStopBtn     = document.getElementById('calib-stop-btn');
    const calibStatusEl    = document.getElementById('calib-status');
    const calibPairCountEl = document.getElementById('calib-pair-count');

    function showStart() {
      startBtn.style.display = 'inline-block'; startBtn.disabled = false;
      stopBtn.style.display  = 'none';
    }
    function showStop() {
      stopBtn.style.display  = 'inline-block'; stopBtn.disabled = false;
      startBtn.style.display = 'none';
    }
    showStart();

    function appendLog(line) {
      const div = document.createElement('div');
      div.className = 'line' +
        (/error|Error|ERROR/.test(line) ? ' err' :
         /done|complete|ready/i.test(line) ? ' ok' :
         /INFO/.test(line) ? ' inf' : '');
      div.textContent = line;
      logPanel.appendChild(div);
      while (logPanel.children.length > 300) logPanel.removeChild(logPanel.firstChild);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    const logSrc = new EventSource('/logs');
    logSrc.onmessage = e => appendLog(JSON.parse(e.data).line);

    let eventSource = null;
    let reconTimes  = [];

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      const res  = await fetch('/start/live', { method: 'POST' });
      const body = await res.json();
      if (!res.ok) { appendLog('Start failed: ' + body.error); startBtn.disabled = false; return; }
      showStop();
      reconTimes = [];
      openEventStream();
    });

    stopBtn.addEventListener('click', async () => {
      stopBtn.disabled = true;
      await fetch('/stop', { method: 'POST' });
      closeEventStream();
      showStart();
    });

    function openEventStream() {
      eventSource = new EventSource('/events');
      eventSource.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.error) { appendLog('Error: ' + data.error); return; }
        if (data.calib_pair !== undefined) { updatePairCount(data.calib_pair); return; }
        if (data.calib_status || data.calib_error) { handleCalibEvent(data); return; }

        const { frame, recon_ms, num_matches } = data;
        reconTimes.push(recon_ms);
        if (reconTimes.length > 10) reconTimes.shift();
        const avg = reconTimes.reduce((a, b) => a + b, 0) / reconTimes.length;
        document.getElementById('s-recon').textContent   = recon_ms + ' ms';
        document.getElementById('s-fps').textContent     = (1000 / avg).toFixed(2) + ' fps';
        document.getElementById('s-frames').textContent  = frame;
        document.getElementById('s-matches').textContent = num_matches ?? '—';
        composite.src = `/composite?v=${frame}`;
        if (data.timings) renderProfile(data.timings, recon_ms);

        // Fetch and render point cloud + refresh camera bases with the new frames
        fetch(`/pointcloud?v=${frame}`)
          .then(r => r.ok ? r.json() : null)
          .then(d => { if (d) updatePointCloud(d); })
          .catch(() => {});
        fetch(`/cameras?v=${frame}`)
          .then(r => r.ok ? r.json() : null)
          .then(d => { if (d) drawCameraFrusta(d); })
          .catch(() => {});
      };
    }

    function closeEventStream() {
      if (eventSource) { eventSource.close(); eventSource = null; }
    }

    // Sync on load
    fetch('/status').then(r => r.json()).then(s => {
      if (s.running) { showStop(); openEventStream(); }
      composite.src = `/composite?v=0`;
      fetchAndDrawCameras();
    });

    // ── Calibration ───────────────────────────────────────────────────
    let pairCount = 0;

    function setCalibStatus(text, cls) {
      calibStatusEl.textContent = text;
      calibStatusEl.className = cls || '';
    }
    function updatePairCount(n) {
      pairCount = n;
      calibPairCountEl.textContent = `${n} pair${n !== 1 ? 's' : ''}`;
    }

    function handleCalibEvent(data) {
      if (data.calib_pair !== undefined) updatePairCount(data.calib_pair);
      if (data.calib_status) {
        const s = data.calib_status;
        const labels = { detecting: 'detecting corners…', calibrating: 'calibrating…',
                         calibrating_intrinsics: 'intrinsics…', calibrating_stereo: 'stereo…' };
        if (labels[s]) setCalibStatus(labels[s]);
        if (s === 'done') {
          const err = data.reprojection_error ? data.reprojection_error.toFixed(3) + 'px' : '';
          setCalibStatus(`done ✓ ${err}`, 'ok');
          calibStopBtn.style.display = 'none';
          calibRunBtn.disabled = false;
          fetchAndDrawCameras();
        }
      }
      if (data.calib_error) {
        setCalibStatus('error: ' + data.calib_error, 'err');
        calibStopBtn.style.display = 'none';
        calibRunBtn.disabled = false;
      }
    }

    calibCaptureBtn.addEventListener('click', async () => {
      calibCaptureBtn.disabled = true;
      setCalibStatus('capturing…');
      const res  = await fetch('/calibrate/capture', { method: 'POST' });
      const body = await res.json();
      calibCaptureBtn.disabled = false;
      if (!res.ok) { setCalibStatus('capture failed: ' + body.error, 'err'); return; }
      updatePairCount(body.pair);
      setCalibStatus(`pair ${body.pair} captured`);
      composite.src = `/calibrate/preview?v=${body.pair}`;
    });

    calibRunBtn.addEventListener('click', async () => {
      if (pairCount < 8) { setCalibStatus(`need ≥ 8 pairs (have ${pairCount})`, 'err'); return; }
      calibRunBtn.disabled = true;
      calibStopBtn.style.display = 'inline-block';
      setCalibStatus('running…');
      const res  = await fetch('/calibrate/run', { method: 'POST' });
      const body = await res.json();
      if (!res.ok) { setCalibStatus('error: ' + body.error, 'err'); calibRunBtn.disabled = false; calibStopBtn.style.display = 'none'; }
    });

    calibResetBtn.addEventListener('click', async () => {
      await fetch('/calibrate/reset', { method: 'POST' });
      updatePairCount(0);
      setCalibStatus('reset');
    });

    calibStopBtn.addEventListener('click', async () => {
      calibStopBtn.disabled = true;
      await fetch('/calibrate/stop', { method: 'POST' });
      calibStopBtn.style.display = 'none';
      calibRunBtn.disabled = false;
      setCalibStatus('stopped');
    });

    // SSE calib events (when loop not running)
    const calibEventSrc = new EventSource('/events');
    calibEventSrc.onmessage = (e) => {
      const data = JSON.parse(e.data);
      handleCalibEvent(data);
    };

    // Sync calibration state on load
    fetch('/calibrate/status').then(r => r.json()).then(s => {
      updatePairCount(s.pair_count || 0);
      if (s.running) { setCalibStatus(s.status || 'running…'); calibStopBtn.style.display = 'inline-block'; }
      else if (s.status === 'done') {
        const err = s.reprojection_error ? s.reprojection_error.toFixed(3) + 'px' : '';
        setCalibStatus(`done ✓ ${err}`, 'ok');
      }
    });
  </script>
</body>
</html>
