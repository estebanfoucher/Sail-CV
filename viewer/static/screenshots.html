<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stereo Screenshots</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #eee; font-family: monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    #header {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 10px 16px; border-bottom: 1px solid #1a1a1a; flex-shrink: 0;
    }
    #header h1 { font-size: 13px; color: #555; font-weight: normal; margin-right: 8px; }
    a.nav { font-size: 11px; color: #888; text-decoration: none; border: 1px solid #333; padding: 4px 10px; border-radius: 4px; }
    button {
      background: #1a1a1a; color: #eee; border: 1px solid #444;
      padding: 5px 14px; border-radius: 4px; font-family: monospace; font-size: 12px; cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    #shot-btn { border-color: #2980b9; color: #3498db; }
    #new-btn { border-color: #27ae60; color: #2ecc71; }
    select {
      background: #1a1a1a; color: #eee; border: 1px solid #444;
      padding: 5px 8px; border-radius: 4px; font-family: monospace; font-size: 12px;
    }
    .sep { width: 1px; height: 20px; background: #222; }
    #status { font-size: 11px; color: #555; margin-left: auto; }
    #status.ok { color: #2ecc71; }
    #status.err { color: #e74c3c; }

    #gallery { flex: 1; overflow-y: auto; padding: 16px; }
    .section { margin-bottom: 28px; }
    .section h2 {
      font-size: 12px; font-weight: normal; color: #888; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 10px; border-bottom: 1px solid #1a1a1a; padding-bottom: 6px;
    }
    .section h2 .count { color: #555; margin-left: 6px; }
    .section-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px;
    }
    .section-empty { color: #444; font-size: 11px; padding: 8px 0; }
    #shot-intrinsic-btn { border-color: #8e44ad; color: #9b59b6; }
    #shot-extrinsic-btn { border-color: #d35400; color: #e67e22; }
    #extr-btn { border-color: #16a085; color: #1abc9c; }
    #calib-btn { border-color: #16a085; color: #1abc9c; }

    #calib-panel {
      margin: 0 16px 16px; padding: 10px 14px; border: 1px solid #1a1a1a;
      border-radius: 6px; background: #050505; font-size: 12px; color: #999;
    }
    #calib-panel.none { color: #555; }
    #calib-panel.err { border-color: #5a1a1a; color: #e74c3c; }
    #calib-panel .row { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 6px; }
    #calib-panel .metric b { color: #ddd; font-weight: normal; }
    #calib-panel .label { color: #16a085; text-transform: uppercase; letter-spacing: 0.05em; font-size: 11px; }
    #calib-panel .created { color: #555; font-size: 10px; }
    #calib-panel .bar { margin-top: 6px; height: 6px; background: #1a1a1a; border-radius: 3px; overflow: hidden; }
    #calib-panel .bar-fill { height: 100%; background: #16a085; transition: width 0.2s ease; }
    .pair {
      border: 1px solid #1a1a1a; border-radius: 6px; overflow: hidden; background: #050505;
    }
    .pair .imgs { display: flex; }
    .pair .imgs img { width: 50%; display: block; border-right: 1px solid #1a1a1a; }
    .pair .imgs img:last-child { border-right: none; }
    .pair .ts { font-size: 11px; color: #777; padding: 6px 10px; border-top: 1px solid #1a1a1a; }
    #empty { color: #444; font-size: 12px; padding: 40px; text-align: center; }
  </style>
</head>
<body>
  <div id="header">
    <h1>Stereo Screenshots</h1>
    <a class="nav" href="/">← 3D Viewer</a>
    <a class="nav" href="/3d-reconstruction">3D Reconstruction →</a>
    <div class="sep"></div>
    <button id="new-btn">New Session</button>
    <select id="session-select"></select>
    <div class="sep"></div>
    <button id="shot-normal-btn" data-kind="normal">Normal</button>
    <button id="shot-intrinsic-btn" data-kind="intrinsic">Intrinsic Calib</button>
    <button id="shot-extrinsic-btn" data-kind="extrinsic">Extrinsic Calib</button>
    <div class="sep"></div>
    <button id="calib-btn">Run Calibration</button>
    <button id="extr-btn" title="Solve stereo extrinsics from the Charuco extrinsic pairs using the known default camera intrinsics. No intrinsic shots needed.">Extrinsic Sync (known cams)</button>
    <span id="status"></span>
  </div>
  <div id="calib-panel" class="none">No calibration for this session.</div>
  <div id="gallery"><div id="empty">No screenshots yet.</div></div>

  <script>
    const KINDS = [
      { key: 'normal', label: 'Normal' },
      { key: 'intrinsic', label: 'Intrinsic Calibration' },
      { key: 'extrinsic', label: 'Extrinsic Calibration' },
    ];

    const sessionSelect = document.getElementById('session-select');
    const gallery = document.getElementById('gallery');
    const statusEl = document.getElementById('status');
    const shotBtns = Array.from(document.querySelectorAll('[data-kind]'));
    const newBtn = document.getElementById('new-btn');
    const calibBtn = document.getElementById('calib-btn');
    const extrBtn = document.getElementById('extr-btn');
    const calibPanel = document.getElementById('calib-panel');

    const fmt = (x, d = 4) => (x === null || x === undefined) ? '—' : Number(x).toFixed(d);

    function renderCalibration(data) {
      const c = data.calibration;
      if (data.running) {
        calibPanel.className = '';
        const p = data.progress;
        const stage = data.status || 'running';
        let bar = '';
        if (p && p.total) {
          const pct = Math.round((p.current / p.total) * 100);
          bar = `
            <div class="row" style="margin-top:8px">
              <span class="metric">${p.label}: <b>${p.current}/${p.total}</b> — detected <b>${p.detected}</b></span>
            </div>
            <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>`;
        }
        calibPanel.innerHTML = `<span class="label">Calibrating</span> — ${stage}…${bar}`;
        return;
      }
      if (data.status === 'error') {
        calibPanel.className = 'err';
        calibPanel.textContent = `Calibration failed: ${data.error || 'unknown error'}`;
        return;
      }
      if (!c) {
        calibPanel.className = 'none';
        calibPanel.textContent = 'No calibration for this session.';
        return;
      }
      const i = c.intrinsics, e = c.extrinsics;
      const fromDefault = c.intrinsics_source === 'default';
      const views = (cam) => (cam.views_used != null && cam.views_total != null)
        ? ` (${cam.views_used}/${cam.views_total})` : '';
      calibPanel.className = '';
      const intrLabel = fromDefault
        ? '<span class="label">Intrinsics</span> <span class="created">default (known cameras)</span>'
        : '';
      calibPanel.innerHTML = `
        <span class="label">Calibration</span> <span class="created">${c.created || ''}</span>
        ${intrLabel}
        <div class="row">
          <span class="metric">cam1 intrinsic err: <b>${fmt(i.cam1.reprojection_error)} px</b>${views(i.cam1)}</span>
          <span class="metric">cam2 intrinsic err: <b>${fmt(i.cam2.reprojection_error)} px</b>${views(i.cam2)}</span>
        </div>
        <div class="row">
          <span class="metric">baseline: <b>${fmt(e.baseline_m, 4)} m</b></span>
          <span class="metric">stereo reproj err: <b>${fmt(e.reprojection_error)} px</b></span>
          <span class="metric">pairs used: <b>${e.pairs_used}/${e.pairs_total}</b></span>
        </div>`;
    }

    async function loadCalibration() {
      const session = selectedSession();
      if (!session) {
        calibPanel.className = 'none';
        calibPanel.textContent = 'No session selected.';
        calibBtn.disabled = true;
        extrBtn.disabled = true;
        return;
      }
      calibBtn.disabled = false;
      extrBtn.disabled = false;
      try {
        const data = await (await fetch(`/session/calibration?session=${encodeURIComponent(session)}`)).json();
        renderCalibration(data);
        calibBtn.disabled = !!data.running;
        extrBtn.disabled = !!data.running;
      } catch (e) { /* ignore */ }
    }

    function setStatus(msg, cls = '') {
      statusEl.textContent = msg;
      statusEl.className = cls;
    }

    function selectedSession() {
      return sessionSelect.value || null;
    }

    async function loadSessions(preferred) {
      const { sessions, active } = await (await fetch('/sessions')).json();
      sessionSelect.innerHTML = '';
      for (const s of sessions) {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s.replace('session_', '');
        sessionSelect.appendChild(opt);
      }
      const target = preferred || active || sessions[0];
      if (target) sessionSelect.value = target;
      await loadPairs();
      await loadCalibration();
    }

    function renderPair(session, kind, p) {
      const div = document.createElement('div');
      div.className = 'pair';
      const base = `/shot/${encodeURIComponent(session)}/${kind}`;
      div.innerHTML = `
        <div class="imgs">
          <img src="${base}/${p.cam1}" alt="cam1" loading="lazy" />
          <img src="${base}/${p.cam2}" alt="cam2" loading="lazy" />
        </div>
        <div class="ts">${p.timestamp}</div>`;
      return div;
    }

    async function loadPairs() {
      const session = selectedSession();
      if (!session) {
        gallery.innerHTML = '<div id="empty">No session yet. Click “New Session”.</div>';
        return;
      }
      const { pairs } = await (await fetch(`/session/pairs?session=${encodeURIComponent(session)}`)).json();
      gallery.innerHTML = '';
      for (const { key, label } of KINDS) {
        const list = pairs[key] || [];
        const section = document.createElement('div');
        section.className = 'section';
        section.innerHTML = `<h2>${label}<span class="count">(${list.length})</span></h2>`;
        if (!list.length) {
          const e = document.createElement('div');
          e.className = 'section-empty';
          e.textContent = 'No screenshots yet.';
          section.appendChild(e);
        } else {
          const grid = document.createElement('div');
          grid.className = 'section-grid';
          for (const p of list.slice().reverse()) grid.appendChild(renderPair(session, key, p));
          section.appendChild(grid);
        }
        gallery.appendChild(section);
      }
    }

    newBtn.addEventListener('click', async () => {
      newBtn.disabled = true;
      setStatus('creating session…');
      try {
        const { session } = await (await fetch('/session/new', { method: 'POST' })).json();
        await loadSessions(session);
        setStatus(`session ${session.replace('session_', '')}`, 'ok');
      } catch (e) {
        setStatus('failed to create session', 'err');
      } finally {
        newBtn.disabled = false;
      }
    });

    for (const btn of shotBtns) {
      btn.addEventListener('click', async () => {
        const kind = btn.dataset.kind;
        shotBtns.forEach(b => b.disabled = true);
        setStatus(`capturing ${kind}…`);
        try {
          const session = selectedSession();
          const q = `kind=${kind}` + (session ? `&session=${encodeURIComponent(session)}` : '');
          const res = await fetch(`/screenshot?${q}`, { method: 'POST' });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'capture failed');
          if (sessionSelect.value !== data.session) await loadSessions(data.session);
          else await loadPairs();
          setStatus(`captured ${kind} ${data.timestamp}`, 'ok');
        } catch (e) {
          setStatus(String(e.message || e), 'err');
        } finally {
          shotBtns.forEach(b => b.disabled = false);
        }
      });
    }

    calibBtn.addEventListener('click', async () => {
      const session = selectedSession();
      if (!session) return;
      calibBtn.disabled = true;
      setStatus('starting calibration…');
      calibPanel.className = '';
      calibPanel.innerHTML = '<span class="label">Calibrating</span> — starting…';
      try {
        const res = await fetch(`/session/calibrate?session=${encodeURIComponent(session)}`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'failed to start');
        setStatus('calibrating…', 'ok');
      } catch (e) {
        setStatus(String(e.message || e), 'err');
        calibBtn.disabled = false;
        await loadCalibration();
      }
    });

    extrBtn.addEventListener('click', async () => {
      const session = selectedSession();
      if (!session) return;
      calibBtn.disabled = true;
      extrBtn.disabled = true;
      setStatus('starting extrinsic sync…');
      calibPanel.className = '';
      calibPanel.innerHTML = '<span class="label">Extrinsic sync</span> — starting (known intrinsics)…';
      try {
        const res = await fetch(`/session/calibrate-extrinsic?session=${encodeURIComponent(session)}`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'failed to start');
        setStatus('solving extrinsics…', 'ok');
      } catch (e) {
        setStatus(String(e.message || e), 'err');
        extrBtn.disabled = false;
        calibBtn.disabled = false;
        await loadCalibration();
      }
    });

    sessionSelect.addEventListener('change', async () => { await loadPairs(); await loadCalibration(); });

    // Live updates: refresh when a screenshot lands in the session we're viewing.
    const events = new EventSource('/events');
    events.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch { return; }
      if (data.session_calib !== undefined) {
        if (data.session === selectedSession()) {
          if (data.session_calib === 'done' || data.session_calib === 'error') {
            calibBtn.disabled = false;
            extrBtn.disabled = false;
            loadCalibration();
          } else if (data.session_calib === 'progress') {
            renderCalibration({ running: true, status: (data.progress && data.progress.phase), progress: data.progress });
          } else {
            renderCalibration({ running: true, status: data.session_calib });
          }
        }
        return;
      }
      if (data.screenshot !== undefined) {
        if (data.session === selectedSession()) loadPairs();
        else loadSessions(data.session);
      } else if (data.session !== undefined && data.screenshot === undefined) {
        loadSessions(data.session);
      }
    };

    loadSessions();
  </script>
</body>
</html>
