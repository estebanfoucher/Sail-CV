<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stereo Screenshots</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #eee; font-family: monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    #header {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 10px 16px; border-bottom: 1px solid #1a1a1a; flex-shrink: 0;
    }
    #header h1 { font-size: 13px; color: #555; font-weight: normal; margin-right: 8px; }
    a.nav { font-size: 11px; color: #888; text-decoration: none; border: 1px solid #333; padding: 4px 10px; border-radius: 4px; }
    button {
      background: #1a1a1a; color: #eee; border: 1px solid #444;
      padding: 5px 14px; border-radius: 4px; font-family: monospace; font-size: 12px; cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    #shot-btn { border-color: #2980b9; color: #3498db; }
    #new-btn { border-color: #27ae60; color: #2ecc71; }
    select {
      background: #1a1a1a; color: #eee; border: 1px solid #444;
      padding: 5px 8px; border-radius: 4px; font-family: monospace; font-size: 12px;
    }
    .sep { width: 1px; height: 20px; background: #222; }
    #status { font-size: 11px; color: #555; margin-left: auto; }
    #status.ok { color: #2ecc71; }
    #status.err { color: #e74c3c; }

    #gallery { flex: 1; overflow-y: auto; padding: 16px; }
    .section { margin-bottom: 28px; }
    .section h2 {
      font-size: 12px; font-weight: normal; color: #888; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 10px; border-bottom: 1px solid #1a1a1a; padding-bottom: 6px;
    }
    .section h2 .count { color: #555; margin-left: 6px; }
    .section-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px;
    }
    .section-empty { color: #444; font-size: 11px; padding: 8px 0; }
    #shot-intrinsic-btn { border-color: #8e44ad; color: #9b59b6; }
    #shot-extrinsic-btn { border-color: #d35400; color: #e67e22; }
    .pair {
      border: 1px solid #1a1a1a; border-radius: 6px; overflow: hidden; background: #050505;
    }
    .pair .imgs { display: flex; }
    .pair .imgs img { width: 50%; display: block; border-right: 1px solid #1a1a1a; }
    .pair .imgs img:last-child { border-right: none; }
    .pair .ts { font-size: 11px; color: #777; padding: 6px 10px; border-top: 1px solid #1a1a1a; }
    #empty { color: #444; font-size: 12px; padding: 40px; text-align: center; }
  </style>
</head>
<body>
  <div id="header">
    <h1>Stereo Screenshots</h1>
    <a class="nav" href="/">← 3D Viewer</a>
    <div class="sep"></div>
    <button id="new-btn">New Session</button>
    <select id="session-select"></select>
    <div class="sep"></div>
    <button id="shot-normal-btn" data-kind="normal">Normal</button>
    <button id="shot-intrinsic-btn" data-kind="intrinsic">Intrinsic Calib</button>
    <button id="shot-extrinsic-btn" data-kind="extrinsic">Extrinsic Calib</button>
    <span id="status"></span>
  </div>
  <div id="gallery"><div id="empty">No screenshots yet.</div></div>

  <script>
    const KINDS = [
      { key: 'normal', label: 'Normal' },
      { key: 'intrinsic', label: 'Intrinsic Calibration' },
      { key: 'extrinsic', label: 'Extrinsic Calibration' },
    ];

    const sessionSelect = document.getElementById('session-select');
    const gallery = document.getElementById('gallery');
    const statusEl = document.getElementById('status');
    const shotBtns = Array.from(document.querySelectorAll('[data-kind]'));
    const newBtn = document.getElementById('new-btn');

    function setStatus(msg, cls = '') {
      statusEl.textContent = msg;
      statusEl.className = cls;
    }

    function selectedSession() {
      return sessionSelect.value || null;
    }

    async function loadSessions(preferred) {
      const { sessions, active } = await (await fetch('/sessions')).json();
      sessionSelect.innerHTML = '';
      for (const s of sessions) {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s.replace('session_', '');
        sessionSelect.appendChild(opt);
      }
      const target = preferred || active || sessions[0];
      if (target) sessionSelect.value = target;
      await loadPairs();
    }

    function renderPair(session, kind, p) {
      const div = document.createElement('div');
      div.className = 'pair';
      const base = `/shot/${encodeURIComponent(session)}/${kind}`;
      div.innerHTML = `
        <div class="imgs">
          <img src="${base}/${p.cam1}" alt="cam1" loading="lazy" />
          <img src="${base}/${p.cam2}" alt="cam2" loading="lazy" />
        </div>
        <div class="ts">${p.timestamp}</div>`;
      return div;
    }

    async function loadPairs() {
      const session = selectedSession();
      if (!session) {
        gallery.innerHTML = '<div id="empty">No session yet. Click “New Session”.</div>';
        return;
      }
      const { pairs } = await (await fetch(`/session/pairs?session=${encodeURIComponent(session)}`)).json();
      gallery.innerHTML = '';
      for (const { key, label } of KINDS) {
        const list = pairs[key] || [];
        const section = document.createElement('div');
        section.className = 'section';
        section.innerHTML = `<h2>${label}<span class="count">(${list.length})</span></h2>`;
        if (!list.length) {
          const e = document.createElement('div');
          e.className = 'section-empty';
          e.textContent = 'No screenshots yet.';
          section.appendChild(e);
        } else {
          const grid = document.createElement('div');
          grid.className = 'section-grid';
          for (const p of list.slice().reverse()) grid.appendChild(renderPair(session, key, p));
          section.appendChild(grid);
        }
        gallery.appendChild(section);
      }
    }

    newBtn.addEventListener('click', async () => {
      newBtn.disabled = true;
      setStatus('creating session…');
      try {
        const { session } = await (await fetch('/session/new', { method: 'POST' })).json();
        await loadSessions(session);
        setStatus(`session ${session.replace('session_', '')}`, 'ok');
      } catch (e) {
        setStatus('failed to create session', 'err');
      } finally {
        newBtn.disabled = false;
      }
    });

    for (const btn of shotBtns) {
      btn.addEventListener('click', async () => {
        const kind = btn.dataset.kind;
        shotBtns.forEach(b => b.disabled = true);
        setStatus(`capturing ${kind}…`);
        try {
          const res = await fetch(`/screenshot?kind=${kind}`, { method: 'POST' });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'capture failed');
          if (sessionSelect.value !== data.session) await loadSessions(data.session);
          else await loadPairs();
          setStatus(`captured ${kind} ${data.timestamp}`, 'ok');
        } catch (e) {
          setStatus(String(e.message || e), 'err');
        } finally {
          shotBtns.forEach(b => b.disabled = false);
        }
      });
    }

    sessionSelect.addEventListener('change', loadPairs);

    // Live updates: refresh when a screenshot lands in the session we're viewing.
    const events = new EventSource('/events');
    events.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch { return; }
      if (data.screenshot !== undefined) {
        if (data.session === selectedSession()) loadPairs();
        else loadSessions(data.session);
      } else if (data.session !== undefined && data.screenshot === undefined) {
        loadSessions(data.session);
      }
    };

    loadSessions();
  </script>
</body>
</html>
